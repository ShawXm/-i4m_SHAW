<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f3460">
<meta name="description" content="یاری بەرگریکردنی شار - وێب ئەپڵیکەیشن">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="City Defender">
<title>🛡️ بەرگریکردنی شار</title>
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0a0a1a;
    color: #fff;
    user-select: none;
  }
  
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 500px;
    margin: 0 auto;
    position: relative;
  }
  
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border-bottom: 2px solid #e94560;
    flex-shrink: 0;
  }
  
  .stat {
    background: rgba(255,255,255,0.08);
    padding: 6px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 14px;
    font-weight: bold;
  }
  
  .stat span { color: #f5c518; }
  
  #gameArea {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 100%, #16213e, #0a0a1a);
  }
  
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(10, 10, 26, 0.95);
    backdrop-filter: blur(8px);
    z-index: 10;
    padding: 30px;
    text-align: center;
    transition: opacity 0.3s;
  }
  
  .overlay.hidden { display: none; }
  
  .overlay h1 {
    font-size: 32px;
    color: #e94560;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(233,69,96,0.6);
  }
  
  .overlay p {
    color: #aaa;
    margin-bottom: 25px;
    line-height: 1.8;
    font-size: 15px;
  }
  
  .btn {
    padding: 14px 40px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #e94560, #c23152);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 15px rgba(233,69,96,0.4);
  }
  
  .btn:active { transform: scale(0.95); }
  .btn:hover { box-shadow: 0 0 25px rgba(233,69,96,0.7); }
  
  .btn-secondary {
    background: linear-gradient(135deg, #16213e, #0f3460);
    box-shadow: 0 4px 15px rgba(15,52,96,0.4);
    margin-top: 12px;
  }
  
  .final-score {
    font-size: 60px;
    font-weight: bold;
    color: #f5c518;
    margin: 15px 0;
    text-shadow: 0 0 30px rgba(245,197,24,0.5);
  }
  
  .sound-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  #installPrompt {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: linear-gradient(135deg, #1a1a2e, #0f3460);
    border: 1px solid #e94560;
    padding: 14px 20px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    transition: transform 0.4s ease;
    z-index: 100;
    width: calc(100% - 40px);
    max-width: 400px;
  }
  
  #installPrompt.show { transform: translateX(-50%) translateY(0); }
  
  #installPrompt button {
    padding: 8px 16px;
    font-size: 14px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }
  
  #installBtn { background: #e94560; color: #fff; }
  #dismissBtn { background: transparent; color: #aaa; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat">🛡️ خاڵ: <span id="score">0</span></div>
    <div class="stat">❤️ ژیان: <span id="lives">3</span></div>
    <div class="stat">🏆 باشترین: <span id="best">0</span></div>
  </header>
  
  <div id="gameArea">
    <canvas id="game"></canvas>
    
    <button class="sound-btn" id="soundBtn" title="دەنگ">🔊</button>
    
    <div class="overlay" id="startScreen">
      <h1>🛡️ بەرگریکردنی شار</h1>
      <p>
        تۆپە دوژمنەکان بەرەو شارەکەت دێن!<br>
        🖱️ بە ماوس یان پەنجە بجووڵێنە<br>
        🎯 بەرگرییەکەت بەکاربهێنە بۆ تێکشکاندنیان<br>
        ⚠️ ڕێگە مەدە بگەنە خوارەوە!
      </p>
      <button class="btn" onclick="startGame()">▶️ دەستپێکردن</button>
    </div>
    
    <div class="overlay hidden" id="endScreen">
      <h1>💥 یاری تەواو!</h1>
      <div class="final-score" id="finalScore">0</div>
      <p id="endMessage">باشە! بەڵام دەتوانیت باشتر بیت</p>
      <button class="btn" onclick="startGame()">🔄 دووبارە یاری</button>
      <button class="btn btn-secondary" onclick="goHome()">🏠 سەرەتا</button>
    </div>
  </div>
</div>

<div id="installPrompt">
  <span style="flex:1; font-size:14px;">📲 ئەم یارییە وەک ئەپ دامەزرێنە!</span>
  <button id="installBtn">دامەزراندن</button>
  <button id="dismissBtn">✕</button>
</div>

<script>
// ====== دەستپێکردنی PWA بە دینامیکی ======
(function initPWA() {
  // دروستکردنی manifest بە دینامیکی
  const manifest = {
    name: "بەرگریکردنی شار - City Defender",
    short_name: "City Defender",
    description: "یارییەکی ئاکشنی خۆش بۆ پاراستنی شارەکەت",
    start_url: window.location.href,
    scope: "./",
    display: "standalone",
    orientation: "portrait",
    background_color: "#0a0a1a",
    theme_color: "#0f3460",
    lang: "ku",
    dir: "rtl",
    categories: ["games", "entertainment"],
    icons: [
      {
        src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#0f3460"/><circle cx="96" cy="96" r="55" fill="none" stroke="#00b4d8" stroke-width="6" opacity="0.5"/><circle cx="96" cy="96" r="35" fill="#00b4d8"/><circle cx="80" cy="80" r="12" fill="#fff" opacity="0.6"/><text x="96" y="160" text-anchor="middle" font-size="24" fill="#e94560" font-family="sans-serif" font-weight="bold">🛡️</text></svg>`),
        sizes: "192x192",
        type: "image/svg+xml",
        purpose: "any maskable"
      },
      {
        src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="100" fill="#0f3460"/><circle cx="256" cy="256" r="150" fill="none" stroke="#00b4d8" stroke-width="15" opacity="0.5"/><circle cx="256" cy="256" r="95" fill="#00b4d8"/><circle cx="215" cy="215" r="32" fill="#fff" opacity="0.6"/><text x="256" y="430" text-anchor="middle" font-size="64" fill="#e94560" font-family="sans-serif" font-weight="bold">🛡️</text></svg>`),
        sizes: "512x512",
        type: "image/svg+xml",
        purpose: "any maskable"
      }
    ]
  };
  
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);
  
  // تۆمارکردنی service worker بە دینامیکی
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'city-defender-v1';
      const ASSETS = ['./'];
      
      self.addEventListener('install', (event) => {
        event.waitUntil(
          caches.open(CACHE_NAME)
            .then(cache => cache.addAll(ASSETS))
            .then(() => self.skipWaiting())
        );
      });
      
      self.addEventListener('activate', (event) => {
        event.waitUntil(
          caches.keys().then(keys =>
            Promise.all(
              keys.filter(key => key !== CACHE_NAME)
                  .map(key => caches.delete(key))
            )
          ).then(() => self.clients.claim())
        );
      });
      
      self.addEventListener('fetch', (event) => {
        event.respondWith(
          caches.match(event.request)
            .then(cached => cached || fetch(event.request)
              .then(response => {
                if (response.status === 200) {
                  const clone = response.clone();
                  caches.open(CACHE_NAME).then(cache => cache.put(event.request, clone));
                }
                return response;
              })
              .catch(() => caches.match('./'))
            )
        );
      });
    `;
    
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swURL = URL.createObjectURL(swBlob);
    
    navigator.serviceWorker.register(swURL)
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW error:', err));
  }
})();

// ====== ئاگادارکردنەوەی دامەزراندن ======
let deferredPrompt;
const installPrompt = document.getElementById('installPrompt');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(() => installPrompt.classList.add('show'), 3000);
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log('Install outcome:', outcome);
  deferredPrompt = null;
  installPrompt.classList.remove('show');
});

document.getElementById('dismissBtn').addEventListener('click', () => {
  installPrompt.classList.remove('show');
});

// ====== یاری ======
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const gameArea = document.getElementById('gameArea');

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const bestEl = document.getElementById('best');
const finalScoreEl = document.getElementById('finalScore');
const endMessage = document.getElementById('endMessage');
const startScreen = document.getElementById('startScreen');
const endScreen = document.getElementById('endScreen');
const soundBtn = document.getElementById('soundBtn');

let best = parseInt(localStorage.getItem('cityDefenderBest') || '0');
bestEl.textContent = best;

let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';
updateSoundBtn();

let gameState = 'menu';
let score, lives, time, wave, lastTime;
let enemies = [];
let particles = [];
let stars = [];
let player;
let spawnTimer;
let enemySpawnRate;

function resizeCanvas() {
  const rect = gameArea.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: rect.width, h: rect.height };
}

let W, H;
function updateSize() {
  const s = resizeCanvas();
  W = s.w;
  H = s.h;
}

window.addEventListener('resize', updateSize);
window.addEventListener('orientationchange', () => setTimeout(updateSize, 200));

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(freq, duration = 0.1, type = 'sine', volume = 0.1) {
  if (!soundEnabled) return;
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function updateSoundBtn() {
  soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
}

soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem('soundEnabled', soundEnabled);
  updateSoundBtn();
  if (soundEnabled) playSound(660, 0.08);
});

function initStars() {
  stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.5 + 0.2,
      alpha: Math.random() * 0.5 + 0.3
    });
  }
}

function startGame() {
  updateSize();
  initStars();
  initAudio();
  
  gameState = 'playing';
  score = 0;
  lives = 3;
  time = 0;
  wave = 1;
  enemies = [];
  particles = [];
  spawnTimer = 0;
  enemySpawnRate = 90;
  
  player = {
    x: W / 2,
    y: H - 60,
    r: 22,
    targetX: W / 2,
    shield: 0,
    maxShield: 100
  };
  
  scoreEl.textContent = '0';
  livesEl.textContent = '3';
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
  playSound(440, 0.15, 'triangle', 0.15);
  setTimeout(() => playSound(660, 0.15, 'triangle', 0.15), 100);
}

function goHome() {
  gameState = 'menu';
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
}

let pointerActive = false;

function handlePointer(clientX) {
  if (gameState !== 'playing' || !player) return;
  const rect = canvas.getBoundingClientRect();
  player.targetX = (clientX - rect.left) * (canvas.width / rect.width) / (window.devicePixelRatio || 1);
  player.targetX = Math.max(player.r, Math.min(W - player.r, player.targetX));
}

canvas.addEventListener('pointerdown', (e) => {
  pointerActive = true;
  handlePointer(e.clientX);
});
canvas.addEventListener('pointermove', (e) => {
  if (pointerActive || e.pointerType === 'mouse') {
    handlePointer(e.clientX);
  }
});
canvas.addEventListener('pointerup', () => pointerActive = false);
canvas.addEventListener('pointerleave', () => pointerActive = false);

const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if (e.key === ' ' && gameState === 'playing') e.preventDefault();
});
window.addEventListener('keyup', (e) => keys[e.key] = false);

function spawnEnemy() {
  const types = ['normal', 'fast', 'tank'];
  const weights = wave < 3 ? [0.8, 0.15, 0.05] : wave < 6 ? [0.6, 0.3, 0.1] : [0.4, 0.35, 0.25];
  const rand = Math.random();
  let type = 'normal';
  let cum = 0;
  for (let i = 0; i < types.length; i++) {
    cum += weights[i];
    if (rand < cum) { type = types[i]; break; }
  }
  
  const config = {
    normal: { r: 16, speed: 1.2, hp: 1, color: '#e94560', score: 10 },
    fast:   { r: 11, speed: 2.5, hp: 1, color: '#f5c518', score: 20 },
    tank:   { r: 24, speed: 0.7, hp: 3, color: '#4ecca3', score: 30 }
  }[type];
  
  enemies.push({
    x: Math.random() * (W - config.r * 2) + config.r,
    y: -config.r - 10,
    vx: (Math.random() - 0.5) * 1.5,
    vy: config.speed + wave * 0.1,
    r: config.r,
    hp: config.hp,
    maxHp: config.hp,
    color: config.color,
    score: config.score,
    type: type,
    hitFlash: 0,
    angle: 0
  });
}

function createParticles(x, y, color, count = 12, speed = 6) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * speed + 1;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      color,
      size: Math.random() * 3 + 1
    });
  }
}

function fireShield() {
  if (!player || player.shield < 30) return;
  player.shield -= 30;
  playSound(880, 0.2, 'sawtooth', 0.12);
  
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dx = e.x - player.x;
    const dy = e.y - player.y;
    if (Math.sqrt(dx*dx + dy*dy) < 150) {
      createParticles(e.x, e.y, e.color, 15);
      score += e.score;
      enemies.splice(i, 1);
      playSound(600 + Math.random() * 300, 0.08, 'square', 0.05);
    }
  }
  scoreEl.textContent = score;
  
  for (let i = 0; i < 30; i++) {
    const ang = (i / 30) * Math.PI * 2;
    particles.push({
      x: player.x,
      y: player.y,
      vx: Math.cos(ang) * 8,
      vy: Math.sin(ang) * 8,
      life: 1,
      decay: 0.04,
      color: '#00b4d8',
      size: 3
    });
  }
}

function update(dt) {
  if (gameState !== 'playing') return;
  
  time += dt;
  
  const newWave = Math.floor(time / 30) + 1;
  if (newWave > wave) {
    wave = newWave;
    enemySpawnRate = Math.max(30, 90 - wave * 5);
    playSound(500, 0.3, 'sine', 0.1);
  }
  
  if (keys['ArrowLeft'] || keys['a']) player.targetX -= 8;
  if (keys['ArrowRight'] || keys['d']) player.targetX += 8;
  player.targetX = Math.max(player.r, Math.min(W - player.r, player.targetX));
  player.x += (player.targetX - player.x) * 0.25;
  
  if (player.shield < player.maxShield) {
    player.shield = Math.min(player.maxShield, player.shield + 0.4);
  }
  
  spawnTimer++;
  if (spawnTimer >= enemySpawnRate) {
    spawnEnemy();
    spawnTimer = 0;
  }
  
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.x += e.vx;
    e.y += e.vy;
    e.angle += 0.03;
    e.hitFlash = Math.max(0, e.hitFlash - 0.1);
    
    if (e.x < e.r || e.x > W - e.r) e.vx *= -1;
    
    const dx = e.x - player.x;
    const dy = e.y - player.y;
    if (Math.sqrt(dx*dx + dy*dy) < e.r + player.r) {
      lives--;
      livesEl.textContent = lives;
      createParticles(e.x, e.y, '#ff0000', 20, 8);
      enemies.splice(i, 1);
      playSound(150, 0.3, 'sawtooth', 0.15);
      
      if (lives <= 0) {
        gameOver();
        return;
      }
      continue;
    }
    
    if (e.y > H + e.r) {
      lives--;
      livesEl.textContent = lives;
      enemies.splice(i, 1);
      playSound(100, 0.4, 'sawtooth', 0.15);
      
      if (lives <= 0) {
        gameOver();
        return;
      }
    }
  }
  
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.vy += 0.15;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

function draw() {
  const grad = ctx.createRadialGradient(W/2, H, 50, W/2, H, H);
  grad.addColorStop(0, '#16213e');
  grad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  for (const s of stars) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  if (gameState === 'menu') return;
  
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.angle);
    
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
    
    if (e.type === 'tank') {
      ctx.fillRect(-e.r, -e.r, e.r*2, e.r*2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(-e.r, -e.r, e.r*2, e.r*2);
    } else if (e.type === 'fast') {
      ctx.beginPath();
      ctx.moveTo(0, -e.r);
      ctx.lineTo(-e.r, e.r);
      ctx.lineTo(e.r, e.r);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, e.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    
    ctx.shadowBlur = 0;
    ctx.restore();
    
    if (e.maxHp > 1) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r*2, 4);
      ctx.fillStyle = '#4ecca3';
      ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r*2 * (e.hp/e.maxHp), 4);
    }
  }
  
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  if (player) {
    const shieldPct = player.shield / player.maxShield;
    if (player.shield >= 30) {
      ctx.strokeStyle = `rgba(0, 180, 216, ${0.3 + shieldPct * 0.5})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r + 15, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    const pg = ctx.createRadialGradient(player.x - 6, player.y - 6, 2, player.x, player.y, player.r);
    pg.addColorStop(0, '#fff');
    pg.addColorStop(0.3, '#00b4d8');
    pg.addColorStop(1, '#0f3460');
    ctx.fillStyle = pg;
    ctx.shadowColor = '#00b4d8';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    if (player.shield >= 30) {
      ctx.fillStyle = '#00b4d8';
      ctx.font = 'bold 14px Tahoma';
      ctx.textAlign = 'center';
      ctx.fillText('⚡', player.x, player.y + 5);
    }
  }
}

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  
  update(dt);
  draw();
  
  if (gameState === 'playing' || gameState === 'paused') {
    requestAnimationFrame(gameLoop);
  }
}

function gameOver() {
  gameState = 'over';
  if (score > best) {
    best = score;
    localStorage.setItem('cityDefenderBest', best);
    bestEl.textContent = best;
  }
  finalScoreEl.textContent = score;
  endMessage.textContent = score >= 300 ? '🏆 نایاب! تۆ شارەزایەکی ڕاستەقینەیت!' :
                          score >= 150 ? '👍 زۆر باشە! بەردەوام بە!' :
                          '💪 باشە! دووبارە هەوڵبدەوە!';
  endScreen.classList.remove('hidden');
  playSound(200, 0.5, 'sawtooth', 0.15);
  setTimeout(() => playSound(150, 0.5, 'sawtooth', 0.15), 200);
}

// دەستپێکردنی سەرەتا
updateSize();
initStars();
draw();

window.addEventListener('resize', () => {
  updateSize();
  initStars();
});

// دەستپێکردنی دەنگی لە یەکەم کلیک
document.addEventListener('click', () => initAudio(), { once: true });
</script>
