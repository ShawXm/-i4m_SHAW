<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یاری بازدانەوەی تۆپ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
  }
  
  .container {
    text-align: center;
    padding: 20px;
  }
  
  h1 {
    font-size: 28px;
    margin-bottom: 15px;
    color: #e94560;
    text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
  }
  
  .info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    font-size: 18px;
  }
  
  .score-box {
    background: rgba(255,255,255,0.1);
    padding: 8px 20px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  
  canvas {
    background: #0a0a1a;
    border-radius: 15px;
    border: 2px solid #e94560;
    box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
    display: block;
    margin: 0 auto;
    cursor: none;
  }
  
  .controls {
    margin-top: 15px;
    font-size: 15px;
    color: #aaa;
  }
  
  button {
    margin-top: 15px;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #e94560, #c23152);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  
  button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
  }
  
  button:active { transform: scale(0.95); }
</style>
</head>
<body>
<div class="container">
  <h1>🎮 یاری بازدانەوەی تۆپ</h1>
  <div class="info">
    <div class="score-box">خاڵ: <span id="score">0</span></div>
    <div class="score-box">باشترین: <span id="best">0</span></div>
  </div>
  <canvas id="game" width="400" height="500"></canvas>
  <div class="controls">🖱️ بە ماوس یان پەنجە تۆپەکە بجووڵێنە بۆ گرتنی ئەستێرەکان</div>
  <button onclick="restartGame()">🔄 دەستپێکردنەوە</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

let best = localStorage.getItem('bestBounce') || 0;
bestEl.textContent = best;

// زانیاری یاری
const player = { x: 200, y: 420, r: 18, speed: 6 };
const stars = [];
const particles = [];
let score = 0;
let gameOver = false;
let keys = {};
let mouseX = null;
let starTimer = 0;

// دروستکردنی ئەستێرە
function spawnStar() {
  stars.push({
    x: Math.random() * (canvas.width - 40) + 20,
    y: -20,
    r: 12,
    speed: 2 + Math.random() * 2.5,
    color: ['#e94560','#f5c518','#4ecca3','#00b4d8','#ff6b6b'][Math.floor(Math.random()*5)],
    angle: 0
  });
}

// دروستکردنی تەنۆلکە (پارتیکل)
function createParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 1,
      color
    });
  }
}

// جووڵاندنی یاری
function update() {
  if (gameOver) return;
  
  // جووڵاندنی بازگە بە ماوس
  if (mouseX !== null) {
    player.x += (mouseX - player.x) * 0.25;
  }
  // جووڵاندن بە کیبۆرد
  if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
  
  player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
  
  // دروستکردنی ئەستێرەکان
  starTimer++;
  if (starTimer > 40) {
    spawnStar();
    starTimer = 0;
  }
  
  // جووڵاندنی ئەستێرەکان
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.y += s.speed;
    s.angle += 0.05;
    
    // پشکنینی گرتن
    const dx = s.x - player.x;
    const dy = s.y - player.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist < s.r + player.r) {
      createParticles(s.x, s.y, s.color);
      stars.splice(i, 1);
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('bestBounce', best);
      }
      continue;
    }
    
    // ئەگەر ئەستێرە بەردەبێت
    if (s.y > canvas.height + 30) {
      stars.splice(i, 1);
      score = Math.max(0, score - 5);
      scoreEl.textContent = score;
    }
  }
  
  // نوێکردنەوەی تەنۆلکەکان
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// وێنەکێشان
function draw() {
  // پاشبنەمای گەردوونی
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // ئەستێرە بچووکەکان
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 30; i++) {
    const x = (i * 137) % canvas.width;
    const y = (i * 73 + Date.now() * 0.01) % canvas.height;
    ctx.fillRect(x, y, 2, 2);
  }
  
  // ئەستێرەکان
  stars.forEach(s => {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);
    ctx.fillStyle = s.color;
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 15;
    drawStar(0, 0, 5, s.r, s.r/2);
    ctx.restore();
  });
  
  // تەنۆلکەکان
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // یاریزان (تۆپ)
  const grad = ctx.createRadialGradient(player.x - 5, player.y - 5, 2, player.x, player.y, player.r);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(0.3, '#e94560');
  grad.addColorStop(1, '#8b1e3f');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // ئەگەر یاری تەواو بوو
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 40px Tahoma';
    ctx.textAlign = 'center';
    ctx.fillText('یاری تەواو!', canvas.width/2, canvas.height/2);
    ctx.fillStyle = '#fff';
    ctx.font = '20px Tahoma';
    ctx.fillText('خاڵ: ' + score, canvas.width/2, canvas.height/2 + 40);
  }
}

// وێنەکێشانی ئەستێرە
function drawStar(cx, cy, spikes, outerR, innerR) {
  let rot = Math.PI / 2 * 3;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerR);
  ctx.closePath();
  ctx.fill();
}

// لوپ
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// کۆنترۆل
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
}, { passive: false });

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

function restartGame() {
  stars.length = 0;
  particles.length = 0;
  score = 0;
  gameOver = false;
  scoreEl.textContent = 0;
  player.x = canvas.width / 2;
}

loop();
</script>
</body>
</html>
