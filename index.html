<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سەرباز و شمشێر - دوورگەی شەڕ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Tahoma, sans-serif;
    color: #eee;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    width: 900px;
    max-width: 100vw;
    height: 600px;
    max-height: 100vh;
    background: #0f3460;
    border: 3px solid #e94560;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(233, 69, 96, 0.4);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
  }
  .ui-panel {
    background: rgba(0,0,0,0.6);
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #e94560;
    font-size: 14px;
  }
  #message {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    padding: 10px 25px;
    border-radius: 20px;
    border: 1px solid #f5c518;
    color: #f5c518;
    font-weight: bold;
    display: none;
    pointer-events: none;
    white-space: nowrap;
  }
  #shop {
    position: absolute;
    bottom: 10px;
    right: 10px;
    display: flex;
    gap: 8px;
    pointer-events: auto;
  }
  .shop-btn {
    background: #16213e;
    color: #fff;
    border: 2px solid #e94560;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: 0.2s;
  }
  .shop-btn:hover { background: #e94560; }
  .shop-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #555; }
  .shop-btn:disabled:hover { background: #16213e; }
  #restartBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #e94560;
    color: #fff;
    border: none;
    padding: 15px 40px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    display: none;
    z-index: 10;
    box-shadow: 0 0 30px rgba(233,69,96,0.8);
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div class="ui-panel">⚔️ ژیان: <span id="hpDisplay">100</span></div>
    <div class="ui-panel">💰 پارە: <span id="goldDisplay">0</span></div>
    <div class="ui-panel">🛡️ پاسەوان: <span id="guardDisplay">0</span></div>
    <div class="ui-panel">🔥 هێز: <span id="powerDisplay">10</span></div>
  </div>
  <div id="message"></div>
  <div id="shop">
    <button class="shop-btn" id="buyGuardBtn">🛡️ پاسەوان (50)</button>
    <button class="shop-btn" id="buyPowerBtn">🔥 هێز +5 (80)</button>
    <button class="shop-btn" id="buyFireSwordBtn">🔥 شمشێری ئاگرین (200)</button>
  </div>
  <button id="restartBtn">🔄 دووبارە دەستپێکردن</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('gameContainer');

// ====== گۆڕاوەکان ======
let W, H;
let player, enemies, guards, particles, floatingTexts;
let gold, playerHP, maxHP, power, hasFireSword, gameOver, keys, mouseX, mouseY, lastSpawn, wave, lastTime;
let cameraX = 0;
let trees = [];
let mountains = [];
let stars = [];

// ====== ڕێکخستنی قەبارە ======
function resize() {
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  W = canvas.width;
  H = canvas.height;
}
window.addEventListener('resize', resize);
resize();

// ====== دروستکردنی جیهان ======
function generateWorld() {
  trees = [];
  mountains = [];
  stars = [];
  
  // ئەستێرەکان
  for (let i = 0; i < 80; i++) {
    stars.push({ x: Math.random() * 2000, y: Math.random() * H * 0.6, r: Math.random() * 1.5, a: Math.random() * 0.6 + 0.2 });
  }
  
  // شاخەکان
  for (let i = 0; i < 15; i++) {
    mountains.push({
      x: Math.random() * 2000 - 500,
      baseY: H * 0.55 + Math.random() * 30,
      w: 150 + Math.random() * 250,
      h: 100 + Math.random() * 200
    });
  }
  
  // دارەکان
  for (let i = 0; i < 40; i++) {
    trees.push({
      x: Math.random() * 2000,
      y: H * 0.55 + Math.random() * (H * 0.35),
      size: 20 + Math.random() * 30
    });
  }
}
generateWorld();

// ====== دەستپێکردن ======
function init() {
  resize();
  generateWorld();
  player = {
    x: 300, y: H * 0.7,
    w: 30, h: 45,
    speed: 3.5,
    facing: 1,
    attackCooldown: 0,
    maxAttackCooldown: 20,
    swingAngle: 0,
    isSwinging: false
  };
  enemies = [];
  guards = [];
  particles = [];
  floatingTexts = [];
  gold = 1000000000;
  maxHP = 100;
  playerHP = maxHP;
  power = 10;
  hasFireSword = false;
  gameOver = false;
  keys = {};
  mouseX = 0; mouseY = 0;
  lastSpawn = 0;
  wave = 1;
  lastTime = performance.now();
  cameraX = 0;
  
  document.getElementById('restartBtn').style.display = 'none';
  updateUI();
  requestAnimationFrame(gameLoop);
}

// ====== UI ======
function updateUI() {
  document.getElementById('hpDisplay').textContent = Math.max(0, Math.floor(playerHP));
  document.getElementById('goldDisplay').textContent = gold;
  document.getElementById('guardDisplay').textContent = guards.length;
  document.getElementById('powerDisplay').textContent = power + (hasFireSword ? ' 🔥' : '');
  
  document.getElementById('buyGuardBtn').disabled = gold < 50;
  document.getElementById('buyPowerBtn').disabled = gold < 80;
  document.getElementById('buyFireSwordBtn').disabled = gold < 200 || hasFireSword;
}

function showMessage(text, color = '#f5c518') {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.style.color = color;
  msg.style.display = 'block';
  clearTimeout(msg._timeout);
  msg._timeout = setTimeout(() => { msg.style.display = 'none'; }, 2000);
}

// ====== کۆنترۆل ======
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left + cameraX;
  mouseY = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
  if (gameOver) return;
  if (e.button === 0) attack();
});

// ====== شەڕکردن ======
function attack() {
  if (player.attackCooldown > 0 || gameOver) return;
  player.attackCooldown = player.maxAttackCooldown;
  player.isSwinging = true;
  player.swingAngle = 0;
  
  // مەودای شمشێر
  const range = hasFireSword ? 120 : 80;
  const dmg = power * (hasFireSword ? 1.8 : 1);
  
  let hitSomething = false;
  
  // لێدانی دوژمنەکان
  enemies.forEach(enemy => {
    if (enemy.dead) return;
    const dx = enemy.x - player.x;
    const dy = enemy.y - (player.y - player.h / 2);
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    // پشکنینی ئاراستە
    const facingDir = player.facing;
    if (dist < range && (dx * facingDir > -30)) {
      enemy.hp -= dmg;
      enemy.hitFlash = 10;
      hitSomething = true;
      
      // ئیفێکتی ئاگر
      if (hasFireSword) {
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: enemy.x, y: enemy.y - 20,
            vx: (Math.random() - 0.5) * 4,
            vy: -Math.random() * 4 - 1,
            life: 1, decay: 0.03,
            color: Math.random() > 0.5 ? '#ff6b00' : '#ffcc00',
            size: 3 + Math.random() * 4
          });
        }
      } else {
        for (let i = 0; i < 5; i++) {
          particles.push({
            x: enemy.x, y: enemy.y - 20,
            vx: (Math.random() - 0.5) * 4,
            vy: -Math.random() * 3 - 1,
            life: 1, decay: 0.04,
            color: '#ff4444', size: 2 + Math.random() * 3
          });
        }
      }
      
      floatingTexts.push({
        x: enemy.x, y: enemy.y - 40,
        text: '-' + Math.round(dmg),
        color: hasFireSword ? '#ff6b00' : '#fff',
        life: 1, vy: -1
      });
      
      if (enemy.hp <= 0) {
        enemy.dead = true;
        gold += enemy.reward;
        showMessage('💰 +' + enemy.reward + ' پارە!', '#4ecca3');
      }
    }
  });
  
  // دەنگی لێدان (بێ دەنگ لەبەر سادەیی)
  if (hitSomething) updateUI();
}

// ====== دروستکردنی دوژمن ======
function spawnEnemy() {
  const type = Math.random();
  let enemy;
  
  if (type < 0.5) {
    // سەربازی ئاسایی
    enemy = {
      x: W + cameraX + 100 + Math.random() * 200,
      y: H * 0.65 + Math.random() * (H * 0.25),
      w: 28, h: 40,
      hp: 30 + wave * 10,
      maxHp: 30 + wave * 10,
      speed: 1 + Math.random() * 0.5,
      dmg: 8 + wave * 2,
      reward: 15 + wave * 3,
      color: '#e94560',
      hitFlash: 0,
      dead: false,
      attackCd: 0
    };
  } else if (type < 0.8) {
    // سەربازی خێرا
    enemy = {
      x: W + cameraX + 100 + Math.random() * 200,
      y: H * 0.65 + Math.random() * (H * 0.25),
      w: 22, h: 32,
      hp: 20 + wave * 5,
      maxHp: 20 + wave * 5,
      speed: 2.5 + Math.random() * 0.8,
      dmg: 5 + wave,
      reward: 20 + wave * 4,
      color: '#f5c518',
      hitFlash: 0,
      dead: false,
      attackCd: 0
    };
  } else {
    // سەربازی گەورە (تانک)
    enemy = {
      x: W + cameraX + 100 + Math.random() * 200,
      y: H * 0.65 + Math.random() * (H * 0.25),
      w: 45, h: 55,
      hp: 100 + wave * 25,
      maxHp: 100 + wave * 25,
      speed: 0.6 + Math.random() * 0.3,
      dmg: 18 + wave * 3,
      reward: 50 + wave * 8,
      color: '#4ecca3',
      hitFlash: 0,
      dead: false,
      attackCd: 0
    };
  }
  
  enemies.push(enemy);
}

// ====== نوێکردنەوە ======
function update(dt) {
  if (gameOver) return;
  
  // جووڵاندنی یاریزان
  let moveX = 0;
  if (keys['a'] || keys['arrowleft']) moveX -= 1;
  if (keys['d'] || keys['arrowright']) moveX += 1;
  
  player.x += moveX * player.speed * dt * 60;
  if (moveX !== 0) player.facing = moveX;
  
  // سنووری جووڵان
  player.x = Math.max(50 + cameraX, Math.min(cameraX + W - 50, player.x));
  
  // کامێرا بەدوای یاریزاندا
  const targetCamX = player.x - W * 0.35;
  cameraX += (targetCamX - cameraX) * 0.08;
  cameraX = Math.max(-100, cameraX);
  
  // کۆتایی هاتنی کاتی شمشێر
  if (player.attackCooldown > 0) player.attackCooldown--;
  if (player.isSwinging) {
    player.swingAngle += 0.3;
    if (player.swingAngle > Math.PI) {
      player.isSwinging = false;
      player.swingAngle = 0;
    }
  }
  
  // دروستکردنی دوژمن
  lastSpawn++;
  if (lastSpawn > Math.max(30, 90 - wave * 5) && enemies.length < 12) {
    spawnEnemy();
    lastSpawn = 0;
    wave = Math.floor(enemies.length / 3) + 1;
  }
  
  // نوێکردنەوەی دوژمنەکان
  enemies.forEach(enemy => {
    if (enemy.dead) return;
    
    const dx = player.x - enemy.x;
    const dy = (player.y - player.h / 2) - (enemy.y - enemy.h / 2);
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist > 50) {
      enemy.x += (dx / dist) * enemy.speed * dt * 60;
      enemy.y += (dy / dist) * enemy.speed * dt * 60;
    }
    
    // لێدانی یاریزان
    if (dist < 55 && enemy.attackCd <= 0) {
      enemy.attackCd = 60;
      playerHP -= enemy.dmg;
      
      floatingTexts.push({
        x: player.x, y: player.y - 60,
        text: '-' + enemy.dmg,
        color: '#ff4444',
        life: 1, vy: -1
      });
      
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: player.x, y: player.y - 30,
          vx: (Math.random() - 0.5) * 5,
          vy: -Math.random() * 4,
          life: 1, decay: 0.04,
          color: '#ff0000', size: 2 + Math.random() * 3
        });
      }
      
      updateUI();
    }
    
    if (enemy.attackCd > 0) enemy.attackCd--;
    if (enemy.hitFlash > 0) enemy.hitFlash--;
    
    // مردنی یاریزان
    if (playerHP <= 0) {
      playerHP = 0;
      gameOver = true;
      document.getElementById('restartBtn').style.display = 'block';
      showMessage('💀 تۆ شکستت هێنا!', '#e94560');
      updateUI();
    }
  });
  
  // لابردنی دوژمنە مردووەکان
  enemies = enemies.filter(e => !e.dead);
  
  // پاسەوانەکان بەدوای دوژمندا دەگەڕێن
  guards.forEach(guard => {
    const nearestEnemy = enemies.find(e => {
      const d = Math.sqrt((e.x - guard.x) ** 2 + (e.y - guard.y) ** 2);
      return d < 300;
    });
    
    if (nearestEnemy) {
      const dx = nearestEnemy.x - guard.x;
      const dy = nearestEnemy.y - guard.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist > 40) {
        guard.x += (dx / dist) * 2 * dt * 60;
        guard.y += (dy / dist) * 2 * dt * 60;
      } else {
        // پاسەوان لێدەدات
        if (guard.attackCd <= 0) {
          guard.attackCd = 40;
          nearestEnemy.hp -= 15;
          nearestEnemy.hitFlash = 5;
          
          for (let i = 0; i < 4; i++) {
            particles.push({
              x: nearestEnemy.x, y: nearestEnemy.y - 20,
              vx: (Math.random() - 0.5) * 3,
              vy: -Math.random() * 3,
              life: 1, decay: 0.05,
              color: '#00b4d8', size: 2 + Math.random() * 2
            });
          }
          
          if (nearestEnemy.hp <= 0) {
            nearestEnemy.dead = true;
            gold += nearestEnemy.reward;
          }
        }
      }
    } else {
      // شوێنکەوتنی یاریزان
      const dx = player.x - 60 - guard.x;
      const dy = (player.y - 30) - guard.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 30) {
        guard.x += (dx / dist) * 2 * dt * 60;
        guard.y += (dy / dist) * 2 * dt * 60;
      }
    }
    
    if (guard.attackCd > 0) guard.attackCd--;
  });
  
  // تەنۆلکەکان
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  // دەقەکان
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy;
    t.life -= 0.02;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
  
  updateUI();
}

// ====== وێنەکێشان ======
function draw() {
  // ئاسمان
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.7);
  skyGrad.addColorStop(0, '#0a0a1a');
  skyGrad.addColorStop(0.6, '#16213e');
  skyGrad.addColorStop(1, '#1a1a3e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  
  // ئەستێرەکان
  stars.forEach(s => {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x - cameraX * 0.1, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // مانگ
  ctx.fillStyle = '#f5f5dc';
  ctx.shadowColor = '#f5f5dc';
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.arc(W * 0.8 - cameraX * 0.05, H * 0.15, 35, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // شاخەکان
  mountains.forEach(m => {
    ctx.fillStyle = '#1a1a3e';
    ctx.beginPath();
    ctx.moveTo(m.x - cameraX * 0.3, m.baseY);
    ctx.lineTo(m.x - cameraX * 0.3 + m.w / 2, m.baseY - m.h);
    ctx.lineTo(m.x - cameraX * 0.3 + m.w, m.baseY);
    ctx.closePath();
    ctx.fill();
    
    // لوتکەی بەفر
    ctx.fillStyle = '#2a2a4e';
    ctx.beginPath();
    ctx.moveTo(m.x - cameraX * 0.3 + m.w * 0.3, m.baseY - m.h * 0.6);
    ctx.lineTo(m.x - cameraX * 0.3 + m.w / 2, m.baseY - m.h);
    ctx.lineTo(m.x - cameraX * 0.3 + m.w * 0.7, m.baseY - m.h * 0.6);
    ctx.closePath();
    ctx.fill();
  });
  
  // زەوی
  const groundY = H * 0.7;
  const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
  groundGrad.addColorStop(0, '#1e3a2e');
  groundGrad.addColorStop(1, '#0f1f18');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, groundY, W, H - groundY);
  
  // دارەکان
  trees.forEach(t => {
    const tx = t.x - cameraX * 0.7;
    if (tx < -100 || tx > W + 100) return;
    
    // قەد
    ctx.fillStyle = '#3d2b1f';
    ctx.fillRect(tx - 4, t.y - t.size, 8, t.size);
    
    // گەڵا
    ctx.fillStyle = '#1a4a2e';
    ctx.beginPath();
    ctx.arc(tx, t.y - t.size - 10, t.size * 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a5a3e';
    ctx.beginPath();
    ctx.arc(tx - 8, t.y - t.size - 15, t.size * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(tx + 10, t.y - t.size - 8, t.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
  });
  
  // پاسەوانەکان
  guards.forEach(guard => {
    const gx = guard.x - cameraX;
    
    // جەستە
    ctx.fillStyle = '#00b4d8';
    ctx.fillRect(gx - 10, guard.y - 35, 20, 30);
    
    // سەر
    ctx.fillStyle = '#00b4d8';
    ctx.beginPath();
    ctx.arc(gx, guard.y - 45, 10, 0, Math.PI * 2);
    ctx.fill();
    
    // شمشێر
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(gx + 12, guard.y - 30);
    ctx.lineTo(gx + 25, guard.y - 55);
    ctx.stroke();
  });
  
  // دوژمنەکان
  enemies.forEach(enemy => {
    if (enemy.dead) return;
    const ex = enemy.x - cameraX;
    
    // جەستە
    ctx.fillStyle = enemy.hitFlash > 0 ? '#fff' : enemy.color;
    ctx.fillRect(ex - enemy.w / 2, enemy.y - enemy.h, enemy.w, enemy.h);
    
    // سەر
    ctx.beginPath();
    ctx.arc(ex, enemy.y - enemy.h - 10, 12, 0, Math.PI * 2);
    ctx.fill();
    
    // چاو
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ex - 4, enemy.y - enemy.h - 12, 3, 0, Math.PI * 2);
    ctx.arc(ex + 4, enemy.y - enemy.h - 12, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(ex - 4, enemy.y - enemy.h - 12, 1.5, 0, Math.PI * 2);
    ctx.arc(ex + 4, enemy.y - enemy.h - 12, 1.5, 0, Math.PI * 2);
    ctx.fill();
    
    // شەمشێر
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(ex + enemy.w / 2, enemy.y - enemy.h / 2);
    ctx.lineTo(ex + enemy.w / 2 + 15, enemy.y - enemy.h / 2 - 15);
    ctx.stroke();
    
    // ژیان
    const hpPct = enemy.hp / enemy.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(ex - enemy.w / 2, enemy.y - enemy.h - 30, enemy.w, 5);
    ctx.fillStyle = hpPct > 0.5 ? '#4ecca3' : hpPct > 0.25 ? '#f5c518' : '#e94560';
    ctx.fillRect(ex - enemy.w / 2, enemy.y - enemy.h - 30, enemy.w * hpPct, 5);
  });
  
  // یاریزان
  const px = player.x - cameraX;
  
  // جەستە
  ctx.fillStyle = '#00b4d8';
  ctx.fillRect(px - 15, player.y - 45, 30, 40);
  
  // سەر
  ctx.fillStyle = '#00b4d8';
  ctx.beginPath();
  ctx.arc(px, player.y - 58, 14, 0, Math.PI * 2);
  ctx.fill();
  
  // چاو
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px - 5 + player.facing * 3, player.y - 60, 4, 0, Math.PI * 2);
  ctx.arc(px + 5 + player.facing * 3, player.y - 60, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(px - 5 + player.facing * 4, player.y - 60, 2, 0, Math.PI * 2);
  ctx.arc(px + 5 + player.facing * 4, player.y - 60, 2, 0, Math.PI * 2);
  ctx.fill();
  
  // شمشێر
  ctx.save();
  ctx.translate(px + player.facing * 18, player.y - 30);
  
  if (player.isSwinging) {
    ctx.rotate(player.facing * (player.swingAngle - Math.PI / 2));
  } else {
    ctx.rotate(player.facing * 0.5);
  }
  
  // تیغی شمشێر
  if (hasFireSword) {
    // ئاگر
    ctx.shadowColor = '#ff6b00';
    ctx.shadowBlur = 25;
    ctx.fillStyle = '#ff6b00';
    ctx.fillRect(-3, -50, 6, 50);
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(-1, -45, 2, 40);
    ctx.shadowBlur = 0;
    
    // تەنۆلکەی ئاگر
    if (Math.random() < 0.5) {
      particles.push({
        x: player.x + player.facing * 18, y: player.y - 60,
        vx: (Math.random() - 0.5) * 2,
        vy: -Math.random() * 3 - 1,
        life: 1, decay: 0.05,
        color: Math.random() > 0.5 ? '#ff6b00' : '#ffcc00',
        size: 2 + Math.random() * 3
      });
    }
  } else {
    ctx.fillStyle = '#ccc';
    ctx.fillRect(-2, -45, 4, 45);
    ctx.fillStyle = '#ddd';
    ctx.fillRect(-1, -45, 2, 45);
  }
  
  ctx.restore();
  
  // دەستی شمشێر
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(px + player.facing * 15, player.y - 35, 6, 8);
  
  // تەنۆلکەکان
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - cameraX, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // دەقەکان
  floatingTexts.forEach(t => {
    ctx.globalAlpha = t.life;
    ctx.fillStyle = t.color;
    ctx.font = 'bold 16px Tahoma';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x - cameraX, t.y);
  });
  ctx.globalAlpha = 1;
  
  // ڕێنمایی
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.font = '14px Tahoma';
  ctx.textAlign = 'center';
  ctx.fillText('A/D یان فلێچکەکان: جووڵان | کلیکی چەپ: شمشێر | دوگمەکان: کڕین', W / 2, H - 15);
}

// ====== لوپ ======
function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  
  update(dt);
  draw();
  
  if (!gameOver) {
    requestAnimationFrame(gameLoop);
  }
}

// ====== کڕین ======
document.getElementById('buyGuardBtn').addEventListener('click', () => {
  if (gold < 50 || gameOver) return;
  gold -= 50;
  guards.push({
    x: player.x - 60,
    y: player.y - 10,
    attackCd: 0
  });
  showMessage('🛡️ پاسەوانێک زیادکرا!', '#00b4d8');
  updateUI();
});

document.getElementById('buyPowerBtn').addEventListener('click', () => {
  if (gold < 80 || gameOver) return;
  gold -= 80;
  power += 5;
  showMessage('🔥 هێزت زیادکرا! (+5)', '#ff6b00');
  updateUI();
});

document.getElementById('buyFireSwordBtn').addEventListener('click', () => {
  if (gold < 200 || hasFireSword || gameOver) return;
  gold -= 200;
  hasFireSword = true;
  showMessage('🔥 شمشێری ئاگرینت کڕی!', '#ff6b00');
  updateUI();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  init();
});

// ====== دەستپێکردن ======
init();
</script>
