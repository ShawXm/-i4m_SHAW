<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تاقیکردنەوەی پەیوەندی</title>
    <style>
        body { font-family: sans-serif; background-color: #0D1114; color: white; padding: 20px; }
        .movie-card { border: 1px solid #333; padding: 15px; margin-bottom: 10px; border-radius: 8px; background-color: #1a1f24; }
        h1 { color: #fff; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>لیستی فیلمەکان لە سێرڤەرەوە</h1>
    <div id="movie-list">چاوەڕوان بە...</div>

    <script>
        // ئەمە کۆدێکی JavaScriptـە کە داتا لە سێرڤەرەکەت دەخوازێت
        async function fetchMovies() {
            try {
                // ئەمە ناونیشانی سێرڤەرەکەتە (کە لە هەنگاوی یەکەم دروستمان کرد)
                const response = await fetch('http://localhost:3000/api/movies');
                const movies = await response.json(); // داتاکە دەگۆڕێت بۆ JSON

                const listDiv = document.getElementById('movie-list');
                listDiv.innerHTML = ''; // پاککردنەوەی دەقی "چاوەڕوان بە"

                // بۆ هەر فیلمێک، کارتێک دروست دەکەین و پیشانی دەدەین
                movies.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <h3>${movie.title} (${movie.year})</strong></h3>
                        <p>جۆر: ${movie.genre}</p>
                    `;
                    listDiv.appendChild(card);
                });
            } catch (error) {
                document.getElementById('movie-list').innerHTML = 
                    `<p class="error">هەڵە: نەتوانرا داتا بهێنرێت. دڵنیابە سێرڤەرەکە کاردەکات. (${error.message})</p>`;
            }
        }

        // کاتێک لاپەڕەکە دەکرێتەوە، ئەم فەنکشنە جێبەجێ دەبێت
        fetchMovies();
    </script>
</body>
</html>
